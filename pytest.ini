[pytest]
# Makes "import diqduq" and "from fixtures.gold_examples import ..." work
# when running plain `pytest` from the repo root, without needing an
# installed package or a root-level conftest.py trick.
pythonpath = .

markers =
    live: exercises the real configured LM instead of DummyLM (skipped by default; run with -m live)

# Offline/DummyLM tests run by default; opt into live-model tests with
# `pytest -m live`.
addopts = -m "not live"
